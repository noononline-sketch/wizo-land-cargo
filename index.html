<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WIZO LAND CARGO</title>
<style>
:root{--blue:#155eef;--navy:#102a56;--bg:#f4f7fb;--line:#e3eaf4;--muted:#64748b;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px system-ui,-apple-system,Segoe UI,Arial;color:#172b4d}
header{background:#fff;border-bottom:1px solid var(--line);padding:15px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:850;color:var(--navy);font-size:20px}.brand span{color:var(--blue)}
select,input,button{font:inherit;border:1px solid #d6dfeb;border-radius:9px;padding:10px;background:#fff}
button{background:var(--blue);color:#fff;border:0;font-weight:650;cursor:pointer}button.secondary{background:#fff;color:var(--navy);border:1px solid var(--line)}button.danger{background:var(--red)}
main{max-width:1180px;margin:24px auto;padding:0 16px}.notice{padding:12px 15px;background:#eaf2ff;border:1px solid #cfe0ff;border-radius:12px;color:#214a90;margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px}
.metric{font-size:25px;font-weight:800;margin-top:7px}.muted{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;margin-top:15px}
h2{font-size:17px;margin:0 0 14px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid label{font-size:12px;color:var(--muted);display:block}.formgrid input,.formgrid select{width:100%;margin-top:5px}
.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}th{color:var(--muted)}
.scroll{overflow:auto}.status{padding:4px 8px;border-radius:20px;background:#eaf2ff;color:#2254a6;white-space:nowrap}
#message{margin-top:10px;font-size:13px;color:var(--muted)}.hidden{display:none!important}.auth{max-width:520px;margin:36px auto}.auth .formgrid{grid-template-columns:1fr}.subtle{font-size:12px;color:var(--muted)}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
@media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header>
 <div class="brand">🚚 WIZO <span>LAND CARGO</span></div>
 <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
  <select id="language" aria-label="Language"><option value="om">Afaan Oromoo</option><option value="en">English</option><option value="am">አማርኛ</option></select>
  <span id="userLabel" class="subtle"></span><button class="secondary" id="loginBtn">Sign in</button><button class="secondary hidden" id="logoutBtn">Sign out</button>
 </div>
</header>
<main>
 <div id="notice" class="notice hidden"></div>
 <section id="authPanel" class="panel auth">
  <h2 id="authTitle">Sign in / Create account</h2>
  <form id="authForm" class="formgrid">
   <div><label>Email</label><input id="email" type="email" autocomplete="email" required></div>
   <div><label>Password</label><input id="password" type="password" minlength="8" autocomplete="current-password" required></div>
   <div class="actions"><button id="authSubmit" type="submit">Sign in</button><button id="signupBtn" class="secondary" type="button">Create account</button></div>
  </form>

  <div id="authMessage"></div>
 </section>
 <section id="businessPanel" class="panel auth hidden">
  <h2>Create your cargo company</h2>
  <form id="businessForm" class="formgrid">
   <div><label>Business / company name</label><input id="businessName" required></div>
   <div><label>Phone</label><input id="businessPhone"></div>
   <div><label>Address</label><input id="businessAddress"></div>
   <div class="actions"><button type="submit">Create company and continue</button></div>
  </form><div id="businessMessage"></div>
 </section>
 <section id="appPanel" class="hidden">
  <div class="topline"><div><b id="companyName">Company</b><div class="subtle" id="businessIdLabel"></div></div><button class="secondary" id="refreshBtn">Refresh dashboard</button></div>
  <section class="cards">
   <div class="card"><div class="muted">Total Shipments</div><div class="metric" id="total">0</div></div>
   <div class="card"><div class="muted">In Transit</div><div class="metric" id="transit">0</div></div>
   <div class="card"><div class="muted">Delivered</div><div class="metric" id="delivered">0</div></div>
   <div class="card"><div class="muted">Recorded Payments (ETB)</div><div class="metric" id="revenue">0</div></div>
  </section>
  <section class="grid">
   <div class="panel">
    <h2>New Cargo Booking</h2>
    <form id="bookingForm" class="formgrid">
     <div><label>Sender name</label><input id="sender" required></div><div><label>Sender phone</label><input id="senderPhone" required></div>
     <div><label>Receiver name</label><input id="receiver" required></div><div><label>Receiver phone</label><input id="receiverPhone" required></div>
     <div><label>Origin city</label><input id="origin" required></div><div><label>Destination city</label><input id="destination" required></div>
     <div><label>Weight (KG)</label><input id="weight" type="number" min="0.001" step="0.001" required></div><div><label>Price (ETB)</label><input id="price" type="number" min="0" step="0.01" required></div>
     <div class="full"><label>Cargo description</label><input id="description"></div>
     <div class="full actions"><button type="submit">Save booking</button></div>
    </form><div id="message"></div>
   </div>
   <div class="panel">
    <h2>Track Cargo</h2><form id="trackForm" class="formgrid"><div class="full"><label>Tracking number</label><input id="trackingNo" placeholder="WZ-..." required></div><div class="full actions"><button type="submit">Track</button></div></form>
    <div id="trackingResult"></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
    <h2>Recent Shipments</h2><div class="scroll"><table><thead><tr><th>Tracking</th><th>Route</th><th>Status</th><th>Price</th></tr></thead><tbody id="shipments"></tbody></table></div>
   </div>
  </section>
 </section>
</main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL='https://bfzfvbvnjuqxsekdzpee.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_oGJclDQShzuvjXmcoU5ftA_EAwP_i_3';
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
let currentUser=null,currentBusiness=null,signupMode=false;
function note(id,msg,isError=false){$(id).textContent=msg;$(id).style.color=isError?'#b42318':''}
function show(id,yes){$(id).classList.toggle('hidden',!yes)}
function trackingCode(){return 'WZ-'+Date.now().toString().slice(-8)+'-'+crypto.getRandomValues(new Uint32Array(1))[0].toString(36).slice(0,4).toUpperCase()}
const translations={
om:{signin:'Seeni',signup:'Account uumi',signout:'Ba’i',signintitle:'WIZO seeni',signupTitle:'Account WIZO uumi',email:'Imeelii',password:'Jecha iccitii',businessTitle:'Dhaabbata fe’umsaa kee uumi',businessName:'Maqaa dhaabbataa',phone:'Bilbila',address:'Teessoo',createCompany:'Dhaabbata uumiitii itti fufi',refresh:'Dashboard haaromsi',total:'Fe’umsawwan waliigalaa',transit:'Imala irra',delivered:'Geessame',payments:'Kaffaltii galmaa’e (ETB)',booking:'Fe’umsaa haaraa galmeessi',sender:'Maqaa ergaa',senderPhone:'Bilbila ergaa',receiver:'Maqaa fudhataa',receiverPhone:'Bilbila fudhataa',origin:'Magaalaa ka’umsaa',destination:'Magaalaa gahumsaa',weight:'Ulfina (KG)',price:'Gatii (ETB)',description:'Ibsa fe’umsaa',save:'Galmeessi',track:'Fe’umsaa hordofi',trackingNo:'Lakkoofsa hordoffii',recent:'Fe’umsawwan dhiheenya',route:'Daandii',status:'Haala',company:'Dhaabbata',searching:'Barbaadaa jira…',saving:'Galmeessaa jira…',creating:'Dhaabbata uumaa jira…',created:'Account uumame. Email kee mirkaneessi, achiis seeni.',noShipment:'Fe’umsaan hin argamne.',bookingSaved:'Fe’umsaan galmaa’e. Lakkoofsa hordoffii:',connected:'Walqabateera. Odeeffannoon dhaabbata kee adda baafamee eegama.',ready:'Account kee qophaa’eera. UUID dhaabbata uumuuf dhaabbata fe’umsaa kee uumi.',signedout:'Baateetta.',working:'Hojjechaa jira…',confirm:'Yoo email mirkaneessuun si gaafate, mirkaneessi.'},
en:{signin:'Sign in',signup:'Create account',signout:'Sign out',signintitle:'Sign in to WIZO',signupTitle:'Create WIZO account',email:'Email',password:'Password',businessTitle:'Create your cargo company',businessName:'Business / company name',phone:'Phone',address:'Address',createCompany:'Create company and continue',refresh:'Refresh dashboard',total:'Total Shipments',transit:'In Transit',delivered:'Delivered',payments:'Recorded Payments (ETB)',booking:'New Cargo Booking',sender:'Sender name',senderPhone:'Sender phone',receiver:'Receiver name',receiverPhone:'Receiver phone',origin:'Origin city',destination:'Destination city',weight:'Weight (KG)',price:'Price (ETB)',description:'Cargo description',save:'Save booking',track:'Track Cargo',trackingNo:'Tracking number',recent:'Recent Shipments',route:'Route',status:'Status',company:'Company',searching:'Searching…',saving:'Saving booking…',creating:'Creating company…',created:'Account created. Check your email to confirm, then sign in.',noShipment:'No shipment found.',bookingSaved:'Booking saved. Tracking number:',connected:'Connected securely. Your company data is separated by business membership.',ready:'Your account is ready. Create your cargo company to generate its Business UUID.',signedout:'You are signed out.',working:'Working…',confirm:'Confirm your email if Supabase asks you to.'},
am:{signin:'ግባ',signup:'መለያ ፍጠር',signout:'ውጣ',signintitle:'ወደ WIZO ግባ',signupTitle:'WIZO መለያ ፍጠር',email:'ኢሜይል',password:'የይለፍ ቃል',businessTitle:'የጭነት ድርጅትዎን ይፍጠሩ',businessName:'የድርጅት ስም',phone:'ስልክ',address:'አድራሻ',createCompany:'ድርጅት ፍጠር እና ቀጥል',refresh:'ዳሽቦርድ አድስ',total:'ጠቅላላ ጭነቶች',transit:'በመጓጓዣ ላይ',delivered:'ደርሷል',payments:'የተመዘገቡ ክፍያዎች (ETB)',booking:'አዲስ ጭነት መመዝገብ',sender:'የላኪ ስም',senderPhone:'የላኪ ስልክ',receiver:'የተቀባይ ስም',receiverPhone:'የተቀባይ ስልክ',origin:'መነሻ ከተማ',destination:'መድረሻ ከተማ',weight:'ክብደት (KG)',price:'ዋጋ (ETB)',description:'የጭነት መግለጫ',save:'ጭነት አስቀምጥ',track:'ጭነት ክትትል',trackingNo:'የክትትል ቁጥር',recent:'የቅርብ ጭነቶች',route:'መንገድ',status:'ሁኔታ',company:'ድርጅት',searching:'በመፈለግ ላይ…',saving:'በማስቀመጥ ላይ…',creating:'ድርጅት በመፍጠር ላይ…',created:'መለያ ተፈጥሯል። ኢሜይልዎን ያረጋግጡና ይግቡ።',noShipment:'ጭነት አልተገኘም።',bookingSaved:'ጭነት ተመዝግቧል። የክትትል ቁጥር:',connected:'በደህና ተገናኝቷል።',ready:'መለያዎ ዝግጁ ነው። የጭነት ድርጅትዎን ይፍጠሩ።',signedout:'ወጥተዋል።',working:'በመስራት ላይ…',confirm:'ከተጠየቁ ኢሜይልዎን ያረጋግጡ።'}
};
let lang='om';
function applyLanguage(){
 const t=translations[lang]||translations.om;document.documentElement.lang=lang;
 $('loginBtn').textContent=t.signin;$('logoutBtn').textContent=t.signout;
 $('authTitle').textContent=signupMode?t.signupTitle:t.signintitle;
 $('authSubmit').textContent=signupMode?t.signup:t.signin;$('signupBtn').textContent=signupMode?t.signin:t.signup;
 document.querySelector('#authForm label:nth-of-type(1)').textContent=t.email;
 document.querySelector('#authForm label:nth-of-type(2)').textContent=t.password;
 $('businessPanel').querySelector('h2').textContent=t.businessTitle;
 const bl=$('businessForm').querySelectorAll('label');bl[0].textContent=t.businessName;bl[1].textContent=t.phone;bl[2].textContent=t.address;
 $('businessForm').querySelector('button').textContent=t.createCompany;
 $('refreshBtn').textContent=t.refresh;
 const metricLabels=document.querySelectorAll('.cards .muted');metricLabels[0].textContent=t.total;metricLabels[1].textContent=t.transit;metricLabels[2].textContent=t.delivered;metricLabels[3].textContent=t.payments;
 const panels=document.querySelectorAll('#appPanel .grid .panel');panels[0].querySelector('h2').textContent=t.booking;panels[1].querySelector('h2').textContent=t.track;
 const labels=panels[0].querySelectorAll('label');[t.sender,t.senderPhone,t.receiver,t.receiverPhone,t.origin,t.destination,t.weight,t.price,t.description].forEach((v,i)=>labels[i].textContent=v);
 panels[0].querySelector('button').textContent=t.save;
 panels[1].querySelector('label').textContent=t.trackingNo;panels[1].querySelector('button').textContent=t.track;
 panels[1].querySelectorAll('h2')[1].textContent=t.recent;
 const th=panels[1].querySelectorAll('th');th[0].textContent='Tracking';th[1].textContent=t.route;th[2].textContent=t.status;th[3].textContent=t.price;
}
function setAuthMode(signup){signupMode=signup;applyLanguage();}
$('signupBtn').onclick=()=>setAuthMode(!signupMode);
$('loginBtn').onclick=()=>{show('authPanel',true);$('email').focus()};
$('authForm').onsubmit=async e=>{e.preventDefault();note('authMessage',translations[lang].working);const email=$('email').value.trim(),password=$('password').value;
 let result=signupMode?await supabase.auth.signUp({email,password}):await supabase.auth.signInWithPassword({email,password});
 if(result.error){note('authMessage',result.error.message,true);return}
 if(signupMode&&!result.data.session){note('authMessage',translations[lang].created);return}
 await initialize();
};
$('logoutBtn').onclick=async()=>{await supabase.auth.signOut();currentUser=null;currentBusiness=null;show('appPanel',false);show('businessPanel',false);show('authPanel',true);$('userLabel').textContent='';show('logoutBtn',false);show('loginBtn',true);note('notice',translations[lang].signedout)};
$('businessForm').onsubmit=async e=>{e.preventDefault();note('businessMessage',translations[lang].creating);const {data,error}=await supabase.rpc('create_my_cargo_business',{p_name:$('businessName').value.trim(),p_phone:$('businessPhone').value.trim()||null,p_address:$('businessAddress').value.trim()||null});
 if(error){note('businessMessage',error.message,true);return}currentBusiness=data;await openApp()};
async function initialize(){
 const {data:{user},error}=await supabase.auth.getUser();if(error||!user){show('authPanel',true);return}
 currentUser=user;$('userLabel').textContent=user.email||'';show('loginBtn',false);show('logoutBtn',true);show('authPanel',false);
 const {data:business,error:be}=await supabase.rpc('get_my_cargo_business');
 if(be){note('notice',be.message,true);return}
 if(!business){show('businessPanel',true);show('appPanel',false);note('notice',translations[lang].ready);return}
 currentBusiness=business;show('businessPanel',false);await openApp();
}
async function openApp(){show('authPanel',false);show('businessPanel',false);show('appPanel',true);$('companyName').textContent=currentBusiness.name;$('businessIdLabel').textContent='Business UUID: '+currentBusiness.id;note('notice',translations[lang].connected);await refreshData()}
async function refreshData(){if(!currentBusiness)return;const bid=currentBusiness.id;
 const {data,error}=await supabase.from('shipments').select('id,tracking_number,origin_city,destination_city,total_price,shipment_status,created_at').eq('business_id',bid).order('created_at',{ascending:false}).limit(100);
 if(error){note('message',error.message,true);return}
 $('total').textContent=data.length;$('transit').textContent=data.filter(x=>x.shipment_status==='in_transit').length;$('delivered').textContent=data.filter(x=>x.shipment_status==='delivered').length;
 const {data:payments,error:pe}=await supabase.from('payments').select('amount').eq('business_id',bid);if(pe){note('message',pe.message,true);return}
 $('revenue').textContent=(payments||[]).reduce((s,p)=>s+Number(p.amount||0),0).toLocaleString();
 $('shipments').innerHTML=data.slice(0,20).map(x=>`<tr><td>${escapeHtml(x.tracking_number)}</td><td>${escapeHtml(x.origin_city)} → ${escapeHtml(x.destination_city)}</td><td><span class="status">${escapeHtml(x.shipment_status)}</span></td><td>${Number(x.total_price).toLocaleString()}</td></tr>`).join('');
}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('bookingForm').onsubmit=async e=>{e.preventDefault();if(!currentBusiness||!currentUser)return;note('message',translations[lang].saving);
 const {data,error}=await supabase.from('shipments').insert({business_id:currentBusiness.id,tracking_number:trackingCode(),sender_name:$('sender').value.trim(),sender_phone:$('senderPhone').value.trim(),receiver_name:$('receiver').value.trim(),receiver_phone:$('receiverPhone').value.trim(),origin_city:$('origin').value.trim(),destination_city:$('destination').value.trim(),weight_kg:Number($('weight').value),cargo_description:$('description').value.trim(),total_price:Number($('price').value),created_by:currentUser.id}).select('id,tracking_number').single();
 if(error){note('message',error.message,true);return}
 await supabase.from('shipment_events').insert({business_id:currentBusiness.id,shipment_id:data.id,status:'booked',notes:'Booking created',created_by:currentUser.id});
 note('message',translations[lang].bookingSaved+' '+data.tracking_number);e.target.reset();await refreshData();
};
$('trackForm').onsubmit=async e=>{e.preventDefault();$('trackingResult').textContent=translations[lang].searching;const {data,error}=await supabase.rpc('public_track_cargo',{p_tracking_number:$('trackingNo').value.trim()});
 if(error){$('trackingResult').textContent=error.message;return}if(!data||!data.length){$('trackingResult').textContent=translations[lang].noShipment;return}
 const x=data[0];$('trackingResult').innerHTML=`<div class="notice"><b>${escapeHtml(x.tracking_number)}</b><br>Route: ${escapeHtml(x.origin_city)} → ${escapeHtml(x.destination_city)}<br>Status: ${escapeHtml(x.shipment_status)}<br>Last update: ${escapeHtml(x.updated_at||'')}</div>`;
};
$('refreshBtn').onclick=refreshData;
$('language').onchange=e=>{lang=e.target.value;applyLanguage()};
supabase.auth.onAuthStateChange((_event,session)=>{if(session?.user){setTimeout(initialize,0)}});
lang=$('language').value;applyLanguage();setAuthMode(false);initialize();
</script>
</body></html>
